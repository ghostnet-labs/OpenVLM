name: "Go Tests"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/test-go.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    runs-on: [self-hosted, Linux, ARM64]
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W build-essential pkg-config libhidapi-dev libusb-1.0-0-dev libudev-dev >/dev/null

      - name: Run tests
        run: make test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          report_type: coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
