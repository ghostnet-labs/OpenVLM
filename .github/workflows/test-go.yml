name: "Go Tests"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/test-go.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghostnet-linux-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 60
    # Bound Go compiler and test fan-out to the one-CPU, 2 GiB ARC pilot.
    env:
      GOFLAGS: -p=1
      GOMAXPROCS: '1'
      GOMEMLIMIT: 1400MiB
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Keep all Go caches inside this runner's workspace allocation.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          # The Mac Studio VM's five runners share one user, so golangci-lint's
          # lock file would make concurrent lint jobs fail.
          args: --allow-parallel-runners

  test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghostnet-linux-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 60
    # Bound Go compiler and test fan-out to the one-CPU, 2 GiB ARC pilot.
    env:
      GOFLAGS: -p=1
      GOMAXPROCS: '1'
      GOMEMLIMIT: 1400MiB
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Keep all Go caches inside this runner's workspace allocation.
      - name: Use per-runner Go caches
        run: |
          base="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_go"
          {
            echo "GOPATH=$base/path"
            echo "GOMODCACHE=$base/path/pkg/mod"
            echo "GOCACHE=$base/build"
            echo "GOLANGCI_LINT_CACHE=$base/golangci-lint"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check build dependencies are installed
        # Native libraries are baked into the immutable ARC runner image.
        run: dpkg-query -W build-essential pkg-config libhidapi-dev libusb-1.0-0-dev libudev-dev >/dev/null

      - name: Run tests
        run: make test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          report_type: coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
